substituters = ["https://cache.ysun.co"]
trusted-public-keys = [
  "cache.ysun.co-1:WxPYwT5g3kt9XhUhHPpNLZKI9HIOsVVAuqSHpok8Qt4=",
]

systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]

include = ["legacyPackages.*.**", "devShells.*.**", "checks.*.*", "formatter.*"]

exclude = [
  "checks.aarch64-linux.integration-initiator", # runner does not have kvm
  "checks.aarch64-linux.integration-responder",
  "checks.aarch64-linux.integration-kernel",
  "checks.aarch64-linux.integration-segments",
  "checks.aarch64-linux.integration-egress",
  "checks.aarch64-linux.netlink",
  # both linux arches put the same files in front of these, so the
  # x86_64-linux arm covers the aarch64 one exactly. go test stays on both,
  # since the race detector is the one check whose answer depends on the
  # memory model underneath it.
  "checks.aarch64-linux.go-lint",
  "checks.aarch64-linux.tree",
  # gofmt, the reuse lint and the prose, nix and toml formatter read one text
  # on every platform. go-lint stays on darwin: the build tags put 1200 lines
  # in front of vet and staticcheck there that no linux run ever compiles.
  "checks.aarch64-darwin.tree",

  "packages.*.*",             # the same derivation as legacyPackages.*.ranet3
  "legacyPackages.*.profile", # on demand, never in CI
]
