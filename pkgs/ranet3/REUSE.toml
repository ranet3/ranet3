# the licenses of the files that cannot carry a comment
version = 1

# each annotation overrides what reuse would find in the files themselves, such
# as the copyright lines third_party.md quotes from the modules it lists
[[annotations]]
path = ["go.sum", "internal/notices/third_party.md"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Nick Cao", "2026 Yifei Sun"]
SPDX-License-Identifier = "MIT AND FSL-1.1-ALv2"

[[annotations]]
path = "internal/registry/testdata/registry.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 Nick Cao"
SPDX-License-Identifier = "MIT"

# a golden file holds a debug render byte for byte, so it has no room for a header
[[annotations]]
path = "control/testdata/debug/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Yifei Sun"
SPDX-License-Identifier = "FSL-1.1-ALv2"

[[annotations]]
path = ["examples/config.json", "gomod2nix.toml", "version.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Yifei Sun"
SPDX-License-Identifier = "FSL-1.1-ALv2"
