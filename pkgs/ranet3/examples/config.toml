# Example ranet3 configuration, and the reference for every key it takes.
# See examples/config.yaml for the same schema under the other decoder: .toml
# goes to the TOML parser, .yaml, .yml and .json to the YAML one, and the keys
# are the same under both.
#
# The top level says what this node is. Everything it does lives under cap, one
# block per capability, and writing a block turns that capability on. A default
# deployment writes node, auth, link and dial and stops.
#
# An optional line starts with "# " followed by a key or a table header. Enable
# one by removing the "# " and nothing else, together with the headers above
# it.

# Who this node is, organization/name, a node the document auth.trust names. A
# byte outside letters, digits, "-", ".", "_" and "~" is written as % and two
# uppercase hex digits, a space in a name as %20.
node = "example/my-laptop"

[auth]
# This node's own key, a PKCS8 PEM Ed25519 file, and the document saying who
# may join, which is a ranet registry.json today.
key = "/etc/ranet3/key.pem"
trust = "/etc/ranet3/trust.json"

# The IDs of RFC 7296 section 3.5 other than a DN, for a peer that is not
# ranet3, such as strongSwan. A ranet3 peer names itself by its DN and needs
# none of them. Under remote, a table for each type takes the ID a peer
# presents, an address under ip, a name under fqdn, an address under email and
# the octets in hex under keyid, and names the endpoint it stands for, whose key
# in the trust document still has to verify the handshake. An FQDN and the
# domain of an email address match in any case, and a KEY_ID spelling an
# endpoint as organization/name:serial needs no entry. Dialing an endpoint
# remote names by one ID, this node asks the peer for that ID, and for none
# where remote names it by several. Under local, a peer, a node or one endpoint of it,
# takes the one ID this node presents to it in place of its DN, and an
# endpoint's entry wins over its node's. A node with two link.endpoints in one
# family cannot have local, since a peer could not tell them apart. A reload
# applies both to the handshakes after it, and a session already up keeps its
# peer. Every endpoint and node named has to be in the trust document, and an
# entry naming one it lacks stops a start and is logged by a reload.
# [auth.aliases.remote.ip]
# "192.0.2.10" = "example/gateway:0"
# [auth.aliases.remote.fqdn]
# "gw.example.net" = "example/gateway:0"
# [auth.aliases.remote.email]
# "ops@example.net" = "example/gateway:0"
# [auth.aliases.remote.keyid]
# "0a1b2c3d" = "example/gateway:0"
# [auth.aliases.local]
# "example/gateway" = { fqdn = "laptop.example.net" }

[link]
port = 13000
# Each entry has to match an endpoint the trust document gives this node, since
# a peer dials that entry. The transport binds every interface and lets the
# kernel pick the source by route.
endpoints = [{ serial = "0", family = "ip4" }]

# Answer peers that dial this node, rather than only dialing. Off by default: a
# leaf has no address to be dialed at, and an open listener is the one surface
# an unauthenticated peer can reach. Any node in the trust document may then
# dial us (dial.to below says who we dial, not who we answer).
# listen = true

# The device the mesh runs on. linux attaches to it when it exists and creates
# it when it does not, and omitted creates ranet3, which is never attached to:
# a second instance on the host needs a tun of its own here, as does a device
# made for this one. darwin's utun control creates nothing but utun, the next
# free unit and the default there, and utunN for unit N, and the daemon refuses
# any other name there when it starts.
# tun = "ranet0"

# The largest packet a session carries inside ESP. The device runs at this
# less the longest cap.segment steer list below, since a steered packet carries
# its segment list inside the tunnel. Omitted it is 1400, which a 1500 byte
# path carries over IPv4 and IPv6 alike. A value under 1280 plus that list, or
# past 65470, the most one ESP-in-UDP datagram carries over IPv4, is refused.
# mtu = 1400

# Keep the one UDP socket carrying IKE and ESP out of the reach of the routes
# the mesh installs. One block for both platforms, because it is one idea: a
# node holding an address an exit announces ends up with a route out of its own
# tun covering the peers it reaches that tun through, and an underlay following
# it is a tunnel running inside itself. Set one of the two on any node that
# takes an exit-announced default. Each is refused by name on the platform that
# has no meaning for it.
#
# mark is SO_MARK on the socket, linux only. The reconciler writes the matching
# rule itself, see cap.table.rules below, and a mark no rule there selects on is
# refused: a marked socket nothing reads follows the mesh table anyway.
#
# bind is IP_BOUND_IF and IPV6_BOUND_IF on the interface the host's own default
# route leaves by, darwin only. It also gives that interface a default of its
# own scoped to it while a route over a zero address leaves by another
# interface, follows both when the machine moves between wifi, ethernet and a
# dock, and tells the reconciler to install an announced default as a real
# default rather than scoping it out of every socket's reach, without which
# this machine cannot use a mesh exit at all.
# [link.underlay]
# mark = 0x726c
# bind = true

[dial]
# Dial every node the trust document names, the N-to-N reconciliation ranet
# does. Needed for reach against a fleet whose other speaker exports only its
# own directly connected routes: a node hears about a prefix from the node that
# originates it or not at all, so dialing a few exits reaches those exits and
# nothing behind them. The entries below still apply and win for their node,
# which is the only way to pin a serial.
# all = true

# One or more existing mesh nodes to dial, each written in full as
# organization/name, or as organization/name:serial to dial one endpoint of a
# node that has several. Each local endpoint only dials remote endpoints of the
# same address family.
to = ["example/gateway:0"]

# What this node puts into the mesh. A node that announces nothing consumes
# routes and originates none.
[cap.route]
# Either a bare prefix or a prefix and the source it is reachable from. The
# second spelling is how an exit announces a default out of its own transit
# prefix. An exit node adds { prefix = "::/0", from = "2001:db8:1::/48" } to
# the list beside its own address, while an ordinary node announces its own address
# and nothing else, as this file does.
announce = ["203.0.113.10/32"]

# Whether this node relays the routes it learns. A node that does carries other
# nodes' packets in plaintext, each decrypted from one session and sealed again
# onto the next. Off when left out, as a leaf wants it. A node that carries the
# mesh writes enable = true.
# [cap.transit]
# enable = true

# The babel speaker's own timers and costs. Omitted, each keeps the default
# below, the value RFC 8966 Appendix B and BIRD use. The two written out here
# are those defaults, so a node that deletes them runs the same speaker.
[cap.babel]
hello = "4s"
update = "16s"

# How a link's Hello loss becomes a cost, RFC 8966 Appendix A.2, spelled the
# way BIRD spells it: "etx", which the fleet runs on these same tunnels, or
# "none" to cost every live link alike however much it drops.
# quality = "etx"

# A fixed rx cost plus up to rtt.weight more, scaled linearly between rtt.min
# and rtt.max.
# [cap.babel.cost]
# rx = 96
# [cap.babel.cost.rtt]
# weight = 1024
# min = "10ms"
# max = "1024ms"

# An amount added to a neighbor's cost, chosen by the identity its session
# proved: the one under node for its organization/name, else the one under org
# for its organization, else foreign for any organization but this node's own.
# The amounts do not add up. Each is 0 to 65534, and it goes on this node's
# cost of the link and on the receive cost its IHUs report back. Every
# organization named has to have a node in the trust document, and every node
# named has to be in it.
# [cap.babel.cost.extra]
# foreign = 1024
# org = { other = 2048 }
# node = { "example/gateway" = 300 }

# Mirror the routes babel learns into a routing table of its own, taking over
# from BIRD's kernel protocols. Absent, this node touches no routes and the
# addresses and routes of its device are yours to configure. The reconciler
# deletes only routes carrying its own protocol, in its own table, out of the
# device, and an install refuses a key another writer already holds rather than
# taking it over. Give it a table no other daemon writes, or the routes it
# refuses are routes the mesh wanted.
# [cap.table]
# id = 200
# proto = 155
# metric = 64                      # BIRD's kbabel uses 32, so not 32 beside it
# prefsrc4 = "203.0.113.10"        # linux only, refused on darwin
# addresses = ["203.0.113.10/32"]  # assigned to the device, removed at exit
# assign_announced = false         # also assign what cap.route announces
# reconcile = "30s"
# capture_grace = "10s"            # how long an announced default outlives the last live session, 1s floor

# Enslave the device to a VRF, and make that device when nothing of the name
# exists. linux only: the other platforms have one forwarding table and refuse
# this by name.
# [cap.table.vrf]
# name = "mesh"
# create = true

# The policy rules the reconciler owns, linux only, in the order written. Each
# carries the protocol above, so a dump reads back only these and a delete can
# never reach another writer's rule, and they are withdrawn at shutdown with
# the routes. darwin scopes an announced default and a source-specific route to
# the tun instead, which reaches the same two ends.
#
# A rule naming an address takes that address's family. One selecting on a mark
# or on iif, the device a packet arrived on, says which family it is for, and
# "both" installs it once per family, which keeping the underlay out of the
# mesh table needs. table takes a number or one of main, local and default.
# [[cap.table.rules]]
# fwmark = 0x726c
# table = "main"
# priority = 40
# family = "both"
# [[cap.table.rules]]
# to = "3fff:b::/48"
# table = 200
# priority = 100
# [[cap.table.rules]]
# from = "203.0.113.10/32"
# table = 200
# priority = 150
#
# A node with an egress segment below sends what arrives on its egress device,
# the tun named link.tun plus e, to main: ranet0e beside the link.tun above,
# ranet3e with the default. It sits after every "to" rule into
# the mesh table, so a steered packet for a mesh destination still goes to the
# mesh, and before every "from" rule into it, which would take the leaf's
# source to the mesh table's default and out of another exit. The load refuses
# it missing or on the wrong side of either.
# [[cap.table.rules]]
# iif = "ranet0e"
# table = "main"
# priority = 120
# family = "both"

# Segment routing, RFC 8986, performed in this process rather than by a kernel,
# so steering works the same on every platform: darwin has no segment routing
# and a mobile tunnel provider has no forwarding table at all, and neither needs
# one when the process carrying the packet is the one acting on the header.
#
# A packet arriving for a local segment is acted on before it reaches the
# device. End sends it to its next segment, End.DT46 strips the outer header
# and hands what was inside to the stack. The spelling is the one
# `ip route ... encap seg6local action` takes. A local segment needs
# cap.border below, which makes it linux only. It acts only on a packet whose
# outer source lies in the overlay's IPv6 prefixes, which means a host beyond
# the mesh reaches none of them through a node that writes cap.border.
# [cap.segment]
# source = "3fff:b:0:100::1"       # the outer source, as `ip sr tunsrc` sets it
#
# The third is an egress segment, an End.DT46 whose inner packet leaves through
# the egress device and out of this node's uplink under cap.egress's source
# translation, so a leaf picks this exit by naming its SID. allow is required:
# a packet passes only when its outer and its inner source are both inside it,
# so the exit is no open proxy. It needs cap.egress, which may advertise
# nothing, the iif rule above, and cap.border below with allow inside its
# overlay. The node announces the SID's /128 itself while the exit is ready,
# so cap.route does not. linux only.
# local = [
#   { sid = "3fff:b:0:106::1", behavior = "End.DT46" },
#   { sid = "3fff:b:0:106::2", behavior = "End" },
#   { sid = "3fff:b:0:106::3", behavior = "End.DT46", deliver = "egress", allow = ["3fff:a::/32", "203.0.113.0/24"] },
# ]

# Which of this node's own packets go through a segment list. from and to
# select the packets, the same pair the forwarding table is keyed by, and an
# entry naming neither is refused because it would steer every packet this node
# sends, babel's own included. via is in the order the packet visits, so the
# waypoints and then the exit. Every steered packet carries the list inside the
# tunnel, so the device's MTU comes down by the longest list configured, and
# one long enough to take it under the 1280 bytes IPv6 requires is refused.
# [[cap.segment.steer]]
# from = "3fff:a::203:0:113:10/128"
# via = ["3fff:b:0:206::1"]

# How long a key lives and how far out of order a packet may arrive.
# [cap.crypto]
# The ESP receive window in packets. Omitted it is 4096, which is wider than
# the interoperable minimum on purpose: a multicore sender reorders bursts by
# more than 32 before they reach userspace. 0 turns replay checking off.
# replay = 4096

# child and ike are each SA's lifetime, which starts when the SA is made. Its
# rekey runs margin and an independently random 0 to jitter before the lifetime
# ends, so margin plus jitter has to be shorter than every interval that is on,
# and margin cannot be 0 beside one. An SA that reaches its lifetime with no
# rekey replacing it closes the IKE SA with a Delete, and the session is dialed
# again. 0 for child or ike turns that lifetime and its rekey off.
# [cap.crypto.rekey]
# child = "1h"
# ike = "3h"
# margin = "5m"
# jitter = "1m"

# A failed rekey is retried with capped exponential backoff, and for the Child
# SA the backoff holds back every path that asks for one. Both have to be
# positive and first cannot exceed max.
# [cap.crypto.rekey.retry]
# first = "5s"
# max = "5m"

# The transforms a session may use, each list most preferred first. A list left
# out is the one written here, which for cipher and prf is every name the list
# takes, and an empty list or a name written twice is refused. A peer whose
# lists share no transform of one kind with these is answered with
# NO_PROPOSAL_CHOSEN. A kex entry is a classical key exchange, which
# IKE_SA_INIT runs, alone or joined with "+" by mlkem768 or mlkem1024, which an
# IKE_INTERMEDIATE exchange of RFC 9370 runs after it. Each entry of a list such
# as ["p384+mlkem1024", "x25519", "p256"] is a proposal of its own. An IKE SA
# rekey runs the joined ML-KEM method in an IKE_FOLLOWUP_KE exchange after its
# CREATE_CHILD_SA, and so may a peer's creation or rekey of a Child SA. An IKE
# SA of a joined entry keeps its ML-KEM method across its rekeys while the list
# holds that entry, and one of a classical entry may move to a joined one. An
# entry that starts with an ML-KEM name, joins a classical name or joins more
# than one is refused. A message larger than the path takes, as those of
# mlkem1024 are on a path of 1500 octets, goes in the fragments of RFC 7383 to a
# peer that supports them. The kex list left out leads with x25519+mlkem768, and
# a peer without ML-KEM meets a classical entry in a proposal after it. A list
# of joined entries alone refuses peers without ML-KEM and leaves an attacker on
# the path no classical exchange to steer two nodes to. A reload applies the
# lists to the next exchange. It rekeys an SA whose cipher or kex entry it
# removed after a delay drawn within the rekey jitter, and no later than the
# SA's scheduled rekey. It replaces through a new handshake an IKE SA whose PRF
# it removed, since no rekey changes the PRF.
# [cap.crypto.ike]
# cipher = ["aes256gcm", "aes128gcm", "chacha20poly1305"]
# prf = ["sha384", "sha256"]
# kex = ["x25519+mlkem768", "x25519", "p384", "p256"]

# The ciphers a Child SA may use, most preferred first, under the same rules.
# [cap.crypto.esp]
# cipher = ["aes256gcm", "aes128gcm", "chacha20poly1305"]

# Carry other nodes' traffic out of the mesh: an exit node advertises the
# defaults, a subnet router the prefixes behind it, and both end at the same
# source translation. linux only, refused by name elsewhere. A prefix here is
# announced only while its family's chain reads back exactly as the node wrote
# it and the kernel forwards the family, so an exit that cannot translate stops
# attracting traffic it would drop. Do not name one of these under cap.route as
# well, which would announce it either way.
#
# A node that translates needs both of the cap.table.rules shapes above, not
# only the "from" one: conntrack reverses the translation before the reply is
# routed, so the reply is addressed to the mesh and has to find a rule sending
# it to the mesh table. Without the "to" rule the outbound half works, the
# nftables counter moves, and every reply leaves by the physical uplink and is
# lost, which reads as a dead exit rather than as a missing rule.
# [cap.egress]
# advertise = ["198.51.100.0/24", "2001:db8:2::/48"]

# The address a translated packet leaves under, per family. Omitted, or written
# as auto, this node's own routes decide it per packet, which is the only
# answer a deployment owning no address block has: leaving the mesh that is the
# address of the link the packet goes out by, and entering it, this node's own
# mesh address. An address written out is used unchanged in both directions.
# An egress segment's packets leave under the same source as the tun's.
# source4 = "auto"
# source6 = "auto"

# Translate the other direction too, so a packet from one of the prefixes above
# enters the mesh under this node's own mesh address. A subnet router needs it
# where the mesh holds no route back to the LAN. An exit node does not: nothing
# sits behind it to start a flow. A node carrying more than one mesh address of
# a family is refused rather than picked from, so name the one to use above.
# return = true

# The periodic pass, which reinstalls a table somebody removed and re-reads the
# forwarding sysctls. Omitted it is 30s.
# sweep = "30s"

# Drop what arrives from outside the mesh and only a forger sends: a source in
# the prefixes the mesh numbers its nodes from, an IPv6 routing header of any
# type, and a packet to one of this node's own local segments. Write it on every
# node that forwards, or a host on any of its links can send a mesh source
# through it to an exit. The devices inside the mesh are derived: the tun, the
# egress device, lo and the VRF master. A local segment needs it, with an IPv6
# prefix in overlay, an egress segment every allow entry inside overlay as
# well, and a prefix cap.egress advertises, a default aside, may not overlap
# overlay. linux only, refused by name elsewhere.
# [cap.border]
# overlay = ["3fff::/20", "203.0.113.0/24"]
