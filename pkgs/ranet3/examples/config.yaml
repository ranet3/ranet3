# The same schema under the other decoder. A configuration file is read by the
# extension it carries. A .toml file goes to the TOML parser, and .yaml, .yml
# and .json go to the YAML one. The keys are identical under both, so a
# deployment that prefers YAML writes this and one that prefers TOML writes
# examples/config.toml.
#
# Every key is documented there. This file is the short form: what a node that
# joins a mesh and announces one address has to say about itself.
#
# An optional YAML line starts with "# " followed by a lowercase key or a list
# item, possibly indented. Enable one by removing only "# ", keeping the
# remaining indentation, and enable its parent keys together with it.

# Who this node is, organization/name, a node the document auth.trust names.
node: example/my-laptop

# This node's own key, a PKCS8 PEM Ed25519 file, and the document saying who
# may join, which is a ranet registry.json today.
auth:
  key: /etc/ranet3/key.pem
  trust: /etc/ranet3/trust.json
  # For a peer that is not ranet3, remote names the endpoint each ID other than
  # a DN stands for, and local the ID this node presents to a peer in place of
  # its DN.
  # aliases:
  #   remote:
  #     ip: { "192.0.2.10": example/gateway:0 }
  #     fqdn: { gw.example.net: example/gateway:0 }
  #     email: { ops@example.net: example/gateway:0 }
  #     keyid: { "0a1b2c3d": example/gateway:0 }
  #   local: { example/gateway: { fqdn: laptop.example.net } }

# The one socket carrying IKE and ESP, and the device the mesh runs on.
link:
  port: 13000
  endpoints:
    - serial: "0"
      family: ip4
  # Answer peers that dial this node as well as dialing. Off by default, and
  # required for a full mesh, where every node both dials and answers.
  # listen: true
  # tun: ranet0
  # The largest packet a session carries inside ESP, 1400 when omitted. The
  # device runs at this less the longest cap.segment steer list.
  # mtu: 1400
  # Keep the one socket carrying IKE and ESP out of the reach of the routes the
  # mesh installs. On linux every underlay socket carries the mark 0x72,
  # which no key sets, where the process may set it. bind is IP_BOUND_IF on the
  # interface the host's own default leaves by plus a default scoped to that
  # interface while a route over a zero address leaves by another, darwin only,
  # and it also makes an announced default install plain rather than scoped. It
  # is refused on linux.
  # underlay:
  #   bind: true

# Who this node dials, each as organization/name or organization/name:serial.
dial:
  # all: true
  to:
    - example/gateway:0

# Everything this node does. A block written here turns that capability on.
cap:
  route:
    # Either a bare prefix or a prefix and the source it is reachable from,
    # such as { prefix: "::/0", from: "2001:db8:1::/48" }, a default for 1
    # source prefix alone. cap.egress below announces an exit's prefixes with no
    # source.
    announce:
      - "203.0.113.10/32"
      # - { prefix: "::/0", from: "2001:db8:1::/48" }
  # Off when left out, and the one block that states its value.
  # transit:
  #   enable: true
  babel:
    hello: 4s
    update: 16s
    # quality: etx
    # cost:
    #   rx: 96
    #   rtt: { weight: 1024, min: 10ms, max: 1024ms }
    #   extra: { foreign: 1024, org: { other: 2048 }, node: { "example/gateway": 300 } }   # added to a neighbor's cost, by node, else org, else foreign
  # table:
  #   id: 200
  #   proto: 155
  #   metric: 64
  #   addresses: ["203.0.113.10/32"]
  #   assign_announced: false
  #   reconcile: 30s
  #   capture_grace: 10s          # how long an announced default outlives the last live session, 1s floor
  # segment:
  #   source: "3fff:b:0:100::1"
  #   local:
  #     - { sid: "3fff:b:0:106::1", behavior: "End.DT46" }
  #   steer:
  #     - { from: "3fff:a::203:0:113:10/128", via: ["3fff:b:0:206::1"] }
  # crypto:
